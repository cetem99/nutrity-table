<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NutriTable — Resultado da Tabela</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/tabela_resultado.css">

  <script src="js/theme.js"></script>
</head>
<body>
  <div id="sidebar-overlay"></div>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-top px-3 py-3 d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center"><div class="ms-2"><div class="brand">Usuário</div></div></div>
        <button class="btn-close d-lg-none" id="sidebar-close"></button>
      </div>
      <nav class="nav flex-column mt-2 px-2" role="navigation"><span class="nav-heading">Principal</span><a
          href="criar_tabela.html" class="nav-item nav-link"><i class="bi bi-plus-circle-fill"></i><span
            class="nav-text">Nova Tabela</span></a><a href="historico.html" class="nav-item nav-link active"><i
            class="bi bi-clock-history"></i><span class="nav-text">Histórico</span></a><!-- <a href="dashboard.html"
          class="nav-item nav-link"><i class="bi bi-bar-chart-line-fill"></i><span
            class="nav-text">Dashboard</span></a> --><span class="nav-heading mt-3">Conta</span><a href="perfil.html"
          class="nav-item nav-link"><i class="bi bi-person"></i><span class="nav-text">Perfil</span></a><a
          href="configuracoes.html" class="nav-item nav-link"><i class="bi bi-gear"></i><span
            class="nav-text">Configurações</span></a></nav>
      <div class="sidebar-bottom p-3"><a href="#" class="logout d-block text-danger mt-2"><i
            class="bi bi-box-arrow-left me-2"></i>Sair</a></div>
    </aside>
    <main id="main">
      <header class="mobile-header d-lg-none">
        <button class="btn" id="sidebar-toggle"><i class="bi bi-list"></i></button>
        <div class="mobile-logo">
          <div class="logo-nt">NT</div>
          <div class="brand ms-2">NutriTable</div>
        </div>
      </header>
      <nav class="top-navbar d-none d-lg-flex">
        <div class="logo-nt">NT</div>
        <div class="ms-3">
          <div class="brand">NutrifyTable</div>
          <div class="subtitle">Gerador de Tabelas</div>
        </div>
      </nav>
      <div class="main-content container-fluid p-4">
        <div class="result-container">
          <header class="d-flex flex-column flex-md-row justify-content-between align-items-start mb-4">
            <div>
              <h1 class="h2 mb-1" id="product-title">Carregando...</h1>
              <p class="text-body-secondary">Aguardando dados da tabela</p>
            </div>
              <div class="d-flex gap-2 mt-2 mt-md-0 flex-wrap">
              <button class="btn btn-outline-secondary"><i class="bi bi-pencil me-1"></i> Editar</button>
              <button class="btn btn-outline-secondary" id="export-pdf-btn"><i class="bi bi-file-earmark-pdf me-1"></i>
                Exportar PDF</button>
              <button class="btn btn-outline-secondary" id="export-csv-btn"><i class="bi bi-download me-1"></i> Exportar
                CSV</button>
              <button class="btn btn-success" id="save-portion-btn"><i class="bi bi-check-circle me-1"></i> Salvar</button>
            </div>
          </header>
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title text-body">Ajustar Porção</h5>

              <p class="card-subtitle text-body-secondary mb-3">Valores serão recalculados automaticamente</p>

              <div style="max-width: 200px;">
                <label for="portion" class="form-label text-body">Porção (g)</label>

                <input type="number" id="portion" class="form-control" value="" placeholder="Ex: 50">
                <div class="form-text">Informe a porção desejada.</div>
              </div>
            </div>
          </div>

          <h4 class="mb-3">Informação Nutricional</h4>

          <div id="nutritional-table-data" class="card nutritional-table">
            <div class="card-body">
              <p class="text-body-secondary mb-0">Nenhum dado carregado.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
    integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/sidebarUser.js"></script>
  <script src="js/apiBase.js"></script>
  <script src="js/tabela_resultado.js"></script>
</body>

</html>
